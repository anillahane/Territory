        jobId:
          type: string
        fileName:
          type: string
        rowCount:
          type: integer
        replaceExisting:
          type: boolean
        confirmWipeAll:
          type: boolean
        worker:
          type: string
        statusUrl:
          type: string
    GeoJsonFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    TerritoryVisualizationResponse:
      type: object
