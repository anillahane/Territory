        lat:
          type: number
        lon:
          type: number
        pocketId:
          type: string
        distance:
          type: integer
        distanceKm:
          type: string
    NearestResponse:
      type: object
      required: [query, count, branches]
      properties:
        query:
          type: object
          required: [lat, lon, limit]
          properties:
            lat:
              type: number
            lon:
              type: number
            limit:
              type: integer
            maxDistance:
              type: number
              nullable: true
        count:
          type: integer
        branches:
          type: array
          items:
            $ref: '#/components/schemas/NearestBranch'
