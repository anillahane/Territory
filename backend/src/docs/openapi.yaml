            ne:
              $ref: '#/components/schemas/CoordinatePoint'
            nw:
              $ref: '#/components/schemas/CoordinatePoint'
            se:
              $ref: '#/components/schemas/CoordinatePoint'
            southwest:
              $ref: '#/components/schemas/CoordinatePoint'
            northeast:
              $ref: '#/components/schemas/CoordinatePoint'
            northwest:
              $ref: '#/components/schemas/CoordinatePoint'
            southeast:
              $ref: '#/components/schemas/CoordinatePoint'
        indices:
