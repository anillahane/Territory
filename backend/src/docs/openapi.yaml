              type: number
            y:
              type: number
        indices:
          type: array
          items:
            $ref: '#/components/schemas/PocketIndex'
        breakdown:
          type: array
          items:
            type: object
            required: [level, levelSize, code, row, col]
            properties:
              level:
                type: integer
