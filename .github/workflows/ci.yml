name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: location_pockets_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run linter
        working-directory: ./backend
        run: npm run lint

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: location_pockets_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage/lcov.info
          flags: backend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

  security-scan:
    name: Security Scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            path: backend
            cache_dependency: backend/package-lock.json
          - app: frontend
            path: frontend
            cache_dependency: frontend/package-lock.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.cache_dependency }}

      - name: Install dependencies
        working-directory: ./${{ matrix.path }}
        run: npm ci

      - name: Run production npm audit with allowlist enforcement
        working-directory: ./${{ matrix.path }}
        shell: bash
        env:
          AUDIT_APP: ${{ matrix.app }}
        run: |
          npm audit --omit=dev --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const report = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'audit.json'), 'utf8'));
          const allowlist = JSON.parse(
            fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, '.github', 'security', 'npm-audit-allowlist.json'),
              'utf8'
            )
          );

          const allowedEntries = allowlist[process.env.AUDIT_APP] || [];
          const allowedMap = new Map(
            allowedEntries.map((entry) => [`${entry.package}:${entry.advisory}`, entry.reason])
          );
          const failures = [];

          for (const vulnerability of Object.values(report.vulnerabilities || {})) {
            const packageName = vulnerability.name;
            const viaEntries = Array.isArray(vulnerability.via) ? vulnerability.via : [];

            for (const viaEntry of viaEntries) {
              if (!viaEntry || typeof viaEntry !== 'object') {
                continue;
              }

              const severity = String(viaEntry.severity || vulnerability.severity || '').toLowerCase();
              if (!['high', 'critical'].includes(severity)) {
                continue;
              }

              const advisoryId = typeof viaEntry.url === 'string'
                ? viaEntry.url.split('/').pop()
                : String(viaEntry.source || '');
              const key = `${packageName}:${advisoryId}`;
              const isAllowlisted = allowedMap.has(key) && vulnerability.fixAvailable === false;

              if (isAllowlisted) {
                console.log(`allowlisted ${key}: ${allowedMap.get(key)}`);
                continue;
              }

              failures.push({
                packageName,
                advisoryId,
                severity,
                fixAvailable: vulnerability.fixAvailable,
              });
            }
          }

          if (failures.length > 0) {
            console.error('Blocking high/critical production vulnerabilities detected:');
            for (const failure of failures) {
              console.error(
                `- ${failure.packageName} ${failure.advisoryId} (${failure.severity}) fixAvailable=${JSON.stringify(failure.fixAvailable)}`
              );
            }
            process.exit(1);
          }

          console.log('No unallowlisted high/critical production vulnerabilities detected.');
          NODE

  image-scan:
    name: Image Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: territory-backend:${{ github.sha }}
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: territory-frontend:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${{ matrix.image }}" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os

      - name: Upload Trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif

      - name: Enforce clean image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os
